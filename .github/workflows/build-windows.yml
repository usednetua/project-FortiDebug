name: Build Windows EXE

on:
  release:
    types: [published]
  workflow_dispatch:
    # Manual run: builds artifact only (no release unless a Release is published)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate application icon
        run: python scripts/generate_icon.py

      - name: Build EXE with PyInstaller
        run: pyinstaller build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortiDebugBuilder-Windows
          path: dist/FortiDebugBuilder.exe
          if-no-files-found: error

      - name: Attach EXE to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/FortiDebugBuilder.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
